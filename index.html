<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RULETA MINTUR</title>
    <!-- Importar la fuente ANTON desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Anton', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4)),
                        url('fondo.png') no-repeat center center;
            background-size: cover;
            overflow: hidden;
            padding: 10px;
            color: white;
        }

        .header-title {
            font-family: 'Anton', sans-serif;
            font-size: clamp(2.8rem, 9vw, 4.5rem);
            color: #ffffff;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 
                4px 4px 0px #000,
                -2px -2px 0px #000,
                2px -2px 0px #000,
                -2px 2px 0px #000,
                0px 6px 15px rgba(0,0,0,0.8);
            text-transform: uppercase;
            margin-top: 5px;
            white-space: nowrap;
        }

        .wheel-container {
            position: relative;
            width: min(92vw, 460px);
            height: min(92vw, 460px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px 0;
        }

        /* Puntero/Flecha indicadora superior */
        .pointer {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            z-index: 10;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.8));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 12px 35px rgba(0,0,0,0.85), 0 0 0 4px rgba(255,255,255,0.3);
        }

        .controls {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .spin-btn {
            background: linear-gradient(180deg, #ffd700 0%, #ff8800 100%);
            border: 3px solid #ffffff;
            color: #000000;
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            padding: 12px 55px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7), inset 0 2px 0 rgba(255,255,255,0.8);
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
            letter-spacing: 2px;
            transition: transform 0.1s, filter 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .spin-btn:active {
            transform: scale(0.94);
        }

        .spin-btn:disabled {
            background: #555555;
            border-color: #888888;
            color: #aaa;
            box-shadow: none;
        }

        /* Modal de resultado */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 3px solid #ffd700;
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            animation: popup 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popup {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-family: Arial, sans-serif;
            font-size: 1.3rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .modal-result {
            font-family: 'Anton', sans-serif;
            font-size: 2.3rem;
            color: #ffffff;
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            letter-spacing: 1px;
        }

        .close-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 12px 32px;
            font-size: 1.3rem;
            font-family: 'Anton', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1 class="header-title">RULETA MINTUR</h1>

    <div class="wheel-container">
        <svg class="pointer" viewBox="0 0 60 60">
            <polygon points="30,55 5,10 55,10" fill="#ffffff" stroke="#2d5a27" stroke-width="8" stroke-linejoin="round"/>
            <polygon points="30,48 10,13 50,13" fill="#ffffff"/>
            <polygon points="30,40 16,16 44,16" fill="none" stroke="#2d5a27" stroke-width="4"/>
        </svg>
        
        <canvas id="canvas" width="800" height="800"></canvas>
    </div>

    <div class="controls">
        <button class="spin-btn" id="spinBtn" onclick="girar()">GIRAR</button>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-title">¡RESULTADO!</div>
            <div class="modal-result" id="resultText">PREMIO 1</div>
            <button class="close-btn" onclick="cerrarModal()">ACEPTAR</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const modal = document.getElementById('resultModal');
        const resultText = document.getElementById('resultText');

        const slices = [
            { text: ["NADA"], color: "#e31e24", type: "nada" },
            { text: ["Trabalenguas", "súper difícil"], color: "#ff7900", type: "reto" },
            { text: ["PREMIO 2"], color: "#ffeb00", type: "premio2" },
            { text: ["PREGUNTA"], color: "#009944", type: "pregunta" },
            { text: ["Trabalenguas"], color: "#1d4099", type: "reto" },
            { text: ["ACENTO", "VIAJERO"], color: "#7e2382", type: "reto" },
            { text: ["NADA"], color: "#e31e24", type: "nada" },
            { text: ["Intenta", "de nuevo"], color: "#ff7900", type: "nada" },
            { text: ["PREMIO 1"], color: "#ffeb00", type: "premio1" },
            { text: ["PREGUNTA"], color: "#009944", type: "pregunta" },
            { text: ["Maleta", "express"], color: "#1d4099", type: "reto" },
            { text: ["CANCIÓN", "VENEZOLANA"], color: "#7e2382", type: "reto" }
        ];

        const totalSlices = slices.length;
        const sliceAngle = (2 * Math.PI) / totalSlices;
        let currentAngle = 0;
        let isSpinning = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(420, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playWinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [440, 554, 659, 880];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime + index * 0.1);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + index * 0.1);
                osc.stop(audioCtx.currentTime + index * 0.1 + 0.25);
            });
        }

        function drawWheel() {
            const width = canvas.width;
            const center = width / 2;
            const radius = center - 16;

            ctx.clearRect(0, 0, width, width);

            ctx.beginPath();
            ctx.arc(center, center, radius + 12, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f172a';
            ctx.fill();

            for (let i = 0; i < totalSlices; i++) {
                const angle = currentAngle + i * sliceAngle;

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, angle, angle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = slices[i].color;
                ctx.fill();
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";

                const lines = slices[i].text;
                const fontSize = lines.length > 1 ? 24 : 29;
                ctx.font = `bold ${fontSize}px 'Anton', Arial, sans-serif`;

                const textRadius = radius - 32;

                lines.forEach((line, lineIndex) => {
                    const yOffset = (lineIndex - (lines.length - 1) / 2) * (fontSize + 4);

                    ctx.lineWidth = 6;
                    ctx.strokeStyle = "#000000";
                    ctx.lineJoin = "round";
                    ctx.strokeText(line, textRadius, yOffset);

                    ctx.fillStyle = "#ffffff";
                    ctx.fillText(line, textRadius, yOffset);
                });

                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(center, center, 42, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#333333';
            ctx.stroke();
        }

        // NUEVAS PROBABILIDADES:
        // Premio 1 (índice 8) = 5%
        // Premio 2 (índice 2) = 5%
        // Las 10 opciones restantes reparten el 90% restante en partes iguales (9% cada una)
        function seleccionarIndiceGanador() {
            const rand = Math.random() * 100;

            if (rand < 5) {
                return 8; // Premio 1 (5%)
            } else if (rand < 10) {
                return 2; // Premio 2 (5%)
            } else {
                // Las otras 10 opciones (índices 0, 1, 3, 4, 5, 6, 7, 9, 10, 11)
                const restoIndices = [0, 1, 3, 4, 5, 6, 7, 9, 10, 11];
                const index = Math.floor(Math.random() * restoIndices.length);
                return restoIndices[index];
            }
        }

        function girar() {
            if (isSpinning) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isSpinning = true;
            spinBtn.disabled = true;

            const targetIndex = seleccionarIndiceGanador();
            const targetSliceAngle = targetIndex * sliceAngle + sliceAngle / 2;
            let targetAngle = (3 * Math.PI / 2) - targetSliceAngle;
            
            const extraRounds = 6 + Math.floor(Math.random() * 3);
            targetAngle += extraRounds * 2 * Math.PI;

            const startAngle = currentAngle % (2 * Math.PI);
            const totalRotation = targetAngle - startAngle;

            const duration = 4800;
            const startTime = performance.now();
            let lastTickSlice = -1;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentAngle = startAngle + totalRotation * easeOut;

                const currentPointerAngle = (3 * Math.PI / 2 - currentAngle) % (2 * Math.PI);
                const normalizedPointerAngle = (currentPointerAngle + 2 * Math.PI) % (2 * Math.PI);
                const currentSlice = Math.floor(normalizedPointerAngle / sliceAngle);

                if (currentSlice !== lastTickSlice) {
                    playTick();
                    lastTickSlice = currentSlice;
                }

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    finalizarGiro(slices[targetIndex]);
                }
            }

            requestAnimationFrame(animate);
        }

        function finalizarGiro(resultado) {
            isSpinning = false;
            spinBtn.disabled = false;

            resultText.innerText = resultado.text.join(' ');
            
            if (resultado.type.includes('premio')) {
                playWinSound();
                confetti({
                    particleCount: 140,
                    spread: 85,
                    origin: { y: 0.6 }
                });
            }

            modal.style.display = 'flex';
        }

        function cerrarModal() {
            modal.style.display = 'none';
        }

        drawWheel();
    </script>
</body>
</html>
