<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RULETA MINTUR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Impact', 'Arial Black', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            /* Carga tu imagen de fondo (fondo.png) */
            background: linear-gradient(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.35)),
                        url('fondo.png') no-repeat center center;
            background-size: cover;
            overflow: hidden;
            padding: 20px 10px;
            color: white;
        }

        /* Título superior colocado por código */
        .header-title {
            font-size: clamp(2.5rem, 8vw, 4.2rem);
            color: #ffffff;
            text-align: center;
            letter-spacing: 3px;
            text-shadow: 
                3px 3px 0px #000,
                -3px -3px 0px #000,
                3px -3px 0px #000,
                -3px 3px 0px #000,
                0px 6px 14px rgba(0,0,0,0.8);
            margin-top: 15px;
            text-transform: uppercase;
        }

        .wheel-container {
            position: relative;
            width: min(88vw, 420px);
            height: min(88vw, 420px);
            margin: auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Flecha verde colocada por código arriba de la ruleta */
        .pointer {
            position: absolute;
            top: -26px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            z-index: 10;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.8));
        }

        /* Ruleta PNG cargada y lista para girar */
        .wheel-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0px 10px 25px rgba(0,0,0,0.85));
            transition: transform 0s;
        }

        .controls {
            margin-bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .spin-btn {
            background: linear-gradient(180deg, #ffd700 0%, #ff8800 100%);
            border: 3px solid #ffffff;
            color: #000000;
            font-family: 'Impact', sans-serif;
            font-size: 1.8rem;
            padding: 14px 50px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7), inset 0 2px 0 rgba(255,255,255,0.8);
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
            letter-spacing: 2px;
            transition: transform 0.1s, filter 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .spin-btn:active {
            transform: scale(0.94);
        }

        .spin-btn:disabled {
            background: #555555;
            border-color: #888888;
            color: #aaa;
            box-shadow: none;
        }

        /* Modal emergente con el resultado */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 3px solid #ffd700;
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            animation: popup 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popup {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 1.3rem;
            color: #94a3b8;
            margin-bottom: 10px;
            font-family: Arial, sans-serif;
        }

        .modal-result {
            font-size: 2.2rem;
            color: #ffffff;
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            line-height: 1.2;
        }

        .close-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 12px 32px;
            font-size: 1.2rem;
            font-family: 'Impact', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1 class="header-title">RULETA MINTUR</h1>

    <div class="wheel-container">
        <!-- SVG de la flecha indicadora verde de tu diseño -->
        <svg class="pointer" viewBox="0 0 60 60">
            <polygon points="30,55 5,10 55,10" fill="#ffffff" stroke="#2d5a27" stroke-width="8" stroke-linejoin="round"/>
            <polygon points="30,48 10,13 50,13" fill="#ffffff"/>
            <polygon points="30,40 16,16 44,16" fill="none" stroke="#2d5a27" stroke-width="4"/>
        </svg>
        
        <!-- Imagen de tu ruleta PNG -->
        <img id="wheelImg" class="wheel-img" src="ruleta.png" alt="Ruleta Mintur">
    </div>

    <div class="controls">
        <button class="spin-btn" id="spinBtn" onclick="girar()">GIRAR</button>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-title">¡RESULTADO!</div>
            <div class="modal-result" id="resultText">PREMIO 1</div>
            <button class="close-btn" onclick="cerrarModal()">ACEPTAR</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const wheelImg = document.getElementById('wheelImg');
        const spinBtn = document.getElementById('spinBtn');
        const modal = document.getElementById('resultModal');
        const resultText = document.getElementById('resultText');

        // Los 12 sectores ordenados exactamente en sentido horario tal como están en tu imagen
        const slices = [
            { text: "NADA", type: "nada" },
            { text: "Trabalenguas súper difícil", type: "reto" },
            { text: "PREMIO 2", type: "premio2" },
            { text: "PREGUNTA", type: "pregunta" },
            { text: "Trabalenguas", type: "reto" },
            { text: "ACENTO VIAJERO", type: "reto" },
            { text: "NADA", type: "nada" },
            { text: "Intenta de nuevo", type: "nada" },
            { text: "PREMIO 1", type: "premio1" },
            { text: "PREGUNTA", type: "pregunta" },
            { text: "Maleta express", type: "reto" },
            { text: "CANCIÓN VENEZOLANA", type: "reto" }
        ];

        const totalSlices = slices.length;
        const sliceAngle = 360 / totalSlices;
        let currentRotation = 0;
        let isSpinning = false;

        // Sonidos Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(420, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playWinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [440, 554, 659, 880];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime + index * 0.1);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + index * 0.1);
                osc.stop(audioCtx.currentTime + index * 0.1 + 0.25);
            });
        }

        // Lógica de probabilidades (5% premios, 35% nada/intenta, 60% retos/preguntas)
        function seleccionarIndiceGanador() {
            const rand = Math.random() * 100;

            if (rand < 5) {
                return Math.random() < 0.5 ? 8 : 2; // PREMIO 1 o PREMIO 2
            } else if (rand < 40) {
                const nadaIndices = [0, 6, 7];
                return nadaIndices[Math.floor(Math.random() * nadaIndices.length)];
            } else {
                const otrosIndices = [1, 3, 4, 5, 9, 10, 11];
                return otrosIndices[Math.floor(Math.random() * otrosIndices.length)];
            }
        }

        function girar() {
            if (isSpinning) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isSpinning = true;
            spinBtn.disabled = true;

            const targetIndex = seleccionarIndiceGanador();
            
            // Ángulo para centrar la casilla bajo la flecha de arriba
            const targetSliceCenter = targetIndex * sliceAngle + sliceAngle / 2;
            let targetDegree = 360 - targetSliceCenter;
            
            // Añadir 6 vueltas completas
            const extraRounds = 6 * 360;
            const finalRotation = currentRotation + (360 - (currentRotation % 360)) + extraRounds + targetDegree;

            const duration = 4800;
            const startTime = performance.now();
            let lastTickSlice = -1;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Animación suave de desaceleración (Ease-out)
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                const degrees = currentRotation + (finalRotation - currentRotation) * easeOut;
                wheelImg.style.transform = `rotate(${degrees}deg)`;

                // Sonido de ticks al pasar cada casilla
                const currentPointerAngle = (360 - (degrees % 360)) % 360;
                const currentSlice = Math.floor(currentPointerAngle / sliceAngle);

                if (currentSlice !== lastTickSlice) {
                    playTick();
                    lastTickSlice = currentSlice;
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentRotation = finalRotation;
                    finalizarGiro(slices[targetIndex]);
                }
            }

            requestAnimationFrame(animate);
        }

        function finalizarGiro(resultado) {
            isSpinning = false;
            spinBtn.disabled = false;

            resultText.innerText = resultado.text;
            
            if (resultado.type.includes('premio')) {
                playWinSound();
                confetti({
                    particleCount: 140,
                    spread: 85,
                    origin: { y: 0.6 }
                });
            }

            modal.style.display = 'flex';
        }

        function cerrarModal() {
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
